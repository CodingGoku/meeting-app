<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MeetStream Pro - Modern Video Conferencing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102,126,234,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            pointer-events: none;
        }

        @keyframes moveBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Join Screen */
        .join-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .join-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.2);
            max-width: 480px;
            width: 100%;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            font-size: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 800;
            margin-top: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 24px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: white;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .btn-primary, .btn-secondary {
            width: 100%;
            padding: 16px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .or-divider {
            text-align: center;
            margin: 24px 0;
            color: #9ca3af;
            font-size: 14px;
            position: relative;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e5e7eb, transparent);
        }

        .or-divider::before { left: 0; }
        .or-divider::after { right: 0; }

        /* Meeting UI */
        .meeting-ui {
            display: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0a0a0f;
            position: relative;
            z-index: 1;
        }

        .header {
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .room-label {
            color: #9ca3af;
            font-size: 14px;
            font-weight: 500;
        }

        .room-code {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 16px;
            font-weight: 600;
            color: white;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            width: auto;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .participant-count {
            background: rgba(102, 126, 234, 0.2);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 40px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        /* Video Grid */
        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            padding: 24px;
            overflow-y: auto;
            min-height: 0;
        }

        .video-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-card:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .participant-name {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            z-index: 5;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Controls Bar */
        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 20px 24px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .control-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.2);
        }

        .control-btn.mic-off,
        .control-btn.cam-off {
            background: #ef4444;
        }

        .control-btn.screen-active {
            background: #10b981;
        }

        .control-btn.leave-btn {
            background: #ef4444;
        }

        /* Tooltip */
        .control-btn {
            position: relative;
        }

        .control-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            font-weight: 500;
        }

        .control-btn:hover::after {
            opacity: 1;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 48px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            animation: slideUpFade 0.3s ease;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Scrollbar */
        .video-grid::-webkit-scrollbar {
            width: 6px;
        }

        .video-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .video-grid::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .join-card {
                padding: 32px 24px;
            }
            .video-grid {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 16px;
            }
            .control-btn {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Join Screen -->
    <div id="joinScreen" class="join-container">
        <div class="join-card">
            <div class="logo">
                <div class="logo-icon">🎥</div>
                <h1>MeetStream Pro</h1>
            </div>
            <div class="subtitle">Premium video meetings, now free</div>
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Your name" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="text" id="roomCode" placeholder="Meeting code" autocomplete="off">
            </div>
            <button class="btn-primary" id="joinBtn">Join Meeting</button>
            <div class="or-divider">or</div>
            <button class="btn-secondary" id="createBtn">Create New Meeting</button>
            <div style="text-align: center; margin-top: 24px; font-size: 12px; color: #9ca3af;">
                🔒 End-to-end encrypted • HD quality • Screen sharing
            </div>
        </div>
    </div>

    <!-- Meeting UI -->
    <div id="meetingUI" class="meeting-ui">
        <div class="header">
            <div class="room-info">
                <span class="room-label">Meeting code:</span>
                <span class="room-code" id="displayRoomCode">XXXXXX</span>
                <button class="icon-btn" id="copyCodeBtn">📋 Copy</button>
                <button class="icon-btn" id="fullscreenBtn">🖥️ Fullscreen</button>
            </div>
            <div class="participant-count" id="participantCount">👥 1 participant</div>
        </div>

        <div class="video-grid" id="videoGrid"></div>

        <div class="controls">
            <button class="control-btn" id="micBtn" data-tooltip="Microphone">🎤</button>
            <button class="control-btn" id="camBtn" data-tooltip="Camera">📷</button>
            <button class="control-btn" id="screenBtn" data-tooltip="Share Screen">🖥️</button>
            <button class="control-btn leave-btn" id="leaveBtn" data-tooltip="Leave Meeting">🔴</button>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const WS_URL = window.location.protocol === 'https:' 
            ? `wss://${window.location.host}` 
            : `ws://${window.location.host}`;
        
        let ws = null;
        let localStream = null;
        let screenStream = null;
        let peerConnections = new Map(); // key: remoteUserId, value: { pc, participantId, userName }
        let currentRoomId = null;
        let userId = null;
        let userName = null;
        let isScreenSharing = false;

        // DOM elements
        const joinScreen = document.getElementById('joinScreen');
        const meetingUI = document.getElementById('meetingUI');
        const videoGrid = document.getElementById('videoGrid');
        const displayRoomCode = document.getElementById('displayRoomCode');
        const copyCodeBtn = document.getElementById('copyCodeBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const micBtn = document.getElementById('micBtn');
        const camBtn = document.getElementById('camBtn');
        const screenBtn = document.getElementById('screenBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const joinBtn = document.getElementById('joinBtn');
        const createBtn = document.getElementById('createBtn');
        const roomCodeInput = document.getElementById('roomCode');
        const usernameInput = document.getElementById('usernameInput');
        const participantCountSpan = document.getElementById('participantCount');

        // ICE servers
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        // ==================== UTILITIES ====================
        function showToast(message, duration = 3000) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }

        function generateUserId() {
            return Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
        }

        function generateRoomCode() {
            return Math.random().toString(36).substring(2, 10).toUpperCase();
        }

        // ==================== PERSISTENCE ====================
        function saveMeetingState(roomId, name) {
            if (roomId && name) {
                localStorage.setItem('meetstream_room', roomId);
                localStorage.setItem('meetstream_name', name);
            } else {
                localStorage.removeItem('meetstream_room');
                localStorage.removeItem('meetstream_name');
            }
        }

        function loadSavedState() {
            const savedRoom = localStorage.getItem('meetstream_room');
            const savedName = localStorage.getItem('meetstream_name');
            if (savedRoom && savedName) {
                // Auto-join after a short delay to let page load
                setTimeout(() => startMeeting(savedRoom, savedName, true), 500);
            }
        }

        // ==================== WEBRTC & SIGNALING ====================
        function connectWebSocket(roomId, userId, userName) {
            return new Promise((resolve, reject) => {
                ws = new WebSocket(WS_URL);
                ws.onopen = () => {
                    ws.send(JSON.stringify({
                        type: 'join-room',
                        roomId: roomId,
                        userId: userId,
                        userName: userName
                    }));
                    resolve();
                };
                ws.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    await handleSignalingMessage(data);
                };
                ws.onerror = (err) => reject(err);
                ws.onclose = () => showToast('Disconnected from server');
            });
        }

        async function handleSignalingMessage(data) {
            switch (data.type) {
                case 'user-joined':
                    await createPeerConnection(data.participantId, data.userId, data.userName, true);
                    break;
                case 'existing-participants':
                    for (const p of data.participants) {
                        await createPeerConnection(p.participantId, p.userId, p.userName, true);
                    }
                    updateParticipantCount();
                    break;
                case 'offer':
                    await handleOffer(data);
                    break;
                case 'answer':
                    await handleAnswer(data);
                    break;
                case 'ice-candidate':
                    await handleIceCandidate(data);
                    break;
                case 'user-left':
                    removePeerConnection(data.userId);
                    updateParticipantCount();
                    showToast(`${data.userName || 'User'} left`);
                    break;
            }
        }

        async function createPeerConnection(participantId, remoteUserId, remoteUserName, isInitiator) {
            if (peerConnections.has(remoteUserId)) return;
            
            const pc = new RTCPeerConnection(configuration);
            peerConnections.set(remoteUserId, { pc, participantId, userName: remoteUserName });
            
            // Add local tracks
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }
            
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: 'ice-candidate',
                        from: userId,
                        to: remoteUserId,
                        data: { candidate: event.candidate }
                    }));
                }
            };
            
            pc.ontrack = (event) => {
                addRemoteVideo(remoteUserId, remoteUserName, event.streams[0]);
            };
            
            if (isInitiator) {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                ws.send(JSON.stringify({
                    type: 'offer',
                    from: userId,
                    to: remoteUserId,
                    data: { sdp: pc.localDescription }
                }));
            }
        }

        async function handleOffer(data) {
            const peer = peerConnections.get(data.from);
            if (!peer) return;
            await peer.pc.setRemoteDescription(new RTCSessionDescription(data.data.sdp));
            const answer = await peer.pc.createAnswer();
            await peer.pc.setLocalDescription(answer);
            ws.send(JSON.stringify({
                type: 'answer',
                from: userId,
                to: data.from,
                data: { sdp: peer.pc.localDescription }
            }));
        }

        async function handleAnswer(data) {
            const peer = peerConnections.get(data.from);
            if (peer && peer.pc.remoteDescription === null) {
                await peer.pc.setRemoteDescription(new RTCSessionDescription(data.data.sdp));
            }
        }

        async function handleIceCandidate(data) {
            const peer = peerConnections.get(data.from);
            if (peer && data.data.candidate) {
                await peer.pc.addIceCandidate(new RTCIceCandidate(data.data.candidate));
            }
        }

        function addRemoteVideo(userId, userName, stream) {
            let card = document.getElementById(`video-${userId}`);
            if (!card) {
                card = document.createElement('div');
                card.className = 'video-card';
                card.id = `video-${userId}`;
                const video = document.createElement('video');
                video.id = `remote-${userId}`;
                video.autoplay = true;
                video.playsInline = true;
                const nameSpan = document.createElement('div');
                nameSpan.className = 'participant-name';
                nameSpan.textContent = userName || `User ${userId.slice(0,4)}`;
                card.appendChild(video);
                card.appendChild(nameSpan);
                videoGrid.appendChild(card);
            }
            const videoElem = card.querySelector('video');
            if (videoElem.srcObject !== stream) {
                videoElem.srcObject = stream;
            }
        }

        function removePeerConnection(userId) {
            const peer = peerConnections.get(userId);
            if (peer) {
                peer.pc.close();
                peerConnections.delete(userId);
            }
            const card = document.getElementById(`video-${userId}`);
            if (card) card.remove();
        }

        // ==================== MEDIA CONTROLS (Fixed) ====================
        async function setupLocalMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                // Add local video card
                const localCard = document.createElement('div');
                localCard.className = 'video-card';
                localCard.id = 'local-video';
                const video = document.createElement('video');
                video.id = 'localVideo';
                video.autoplay = true;
                video.playsInline = true;
                video.muted = true;
                video.srcObject = localStream;
                const nameSpan = document.createElement('div');
                nameSpan.className = 'participant-name';
                nameSpan.textContent = `${userName} (You)`;
                localCard.appendChild(video);
                localCard.appendChild(nameSpan);
                videoGrid.insertBefore(localCard, videoGrid.firstChild);
                
                // Reset button styles
                micBtn.classList.remove('mic-off');
                camBtn.classList.remove('cam-off');
                return true;
            } catch (err) {
                showToast('Please allow camera and microphone access');
                return false;
            }
        }

        // Replace camera track properly
        async function toggleCamera() {
            if (!localStream) return;
            
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack && videoTrack.enabled) {
                // Turn off: stop track and remove
                videoTrack.stop();
                localStream.removeTrack(videoTrack);
                camBtn.classList.add('cam-off');
                showToast('Camera off');
            } else {
                // Turn on: get new stream and replace
                try {
                    const newStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    const newVideoTrack = newStream.getVideoTracks()[0];
                    // Replace track in local stream
                    const oldVideo = localStream.getVideoTracks()[0];
                    if (oldVideo) {
                        localStream.removeTrack(oldVideo);
                    }
                    localStream.addTrack(newVideoTrack);
                    
                    // Update local video element
                    const localVideo = document.getElementById('localVideo');
                    if (localVideo) {
                        const newCombined = new MediaStream();
                        localStream.getTracks().forEach(t => newCombined.addTrack(t));
                        localVideo.srcObject = newCombined;
                        localStream = newCombined;
                    }
                    
                    // Replace in all peer connections
                    for (const [_, peer] of peerConnections) {
                        const sender = peer.pc.getSenders().find(s => s.track?.kind === 'video');
                        if (sender) {
                            await sender.replaceTrack(newVideoTrack);
                        } else {
                            peer.pc.addTrack(newVideoTrack, localStream);
                        }
                    }
                    camBtn.classList.remove('cam-off');
                    showToast('Camera on');
                } catch (err) {
                    showToast('Could not access camera');
                }
            }
        }

        // Replace microphone track properly
        async function toggleMic() {
            if (!localStream) return;
            
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack && audioTrack.enabled) {
                // Turn off
                audioTrack.stop();
                localStream.removeTrack(audioTrack);
                micBtn.classList.add('mic-off');
                showToast('Microphone off');
            } else {
                // Turn on
                try {
                    const newStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const newAudioTrack = newStream.getAudioTracks()[0];
                    const oldAudio = localStream.getAudioTracks()[0];
                    if (oldAudio) localStream.removeTrack(oldAudio);
                    localStream.addTrack(newAudioTrack);
                    
                    // Update peer connections
                    for (const [_, peer] of peerConnections) {
                        const sender = peer.pc.getSenders().find(s => s.track?.kind === 'audio');
                        if (sender) {
                            await sender.replaceTrack(newAudioTrack);
                        } else {
                            peer.pc.addTrack(newAudioTrack, localStream);
                        }
                    }
                    micBtn.classList.remove('mic-off');
                    showToast('Microphone on');
                } catch (err) {
                    showToast('Could not access microphone');
                }
            }
        }

        async function startScreenShare() {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenTrack = screenStream.getVideoTracks()[0];
                for (const [_, peer] of peerConnections) {
                    const sender = peer.pc.getSenders().find(s => s.track?.kind === 'video');
                    if (sender) sender.replaceTrack(screenTrack);
                }
                screenTrack.onended = () => stopScreenShare();
                isScreenSharing = true;
                screenBtn.classList.add('screen-active');
                showToast('Screen sharing started');
            } catch (err) {
                showToast('Screen share cancelled');
            }
        }

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            isScreenSharing = false;
            screenBtn.classList.remove('screen-active');
            // Restore camera if it was on
            if (localStream && localStream.getVideoTracks()[0]?.enabled) {
                const cameraTrack = localStream.getVideoTracks()[0];
                for (const [_, peer] of peerConnections) {
                    const sender = peer.pc.getSenders().find(s => s.track?.kind === 'video');
                    if (sender && cameraTrack) sender.replaceTrack(cameraTrack);
                }
            }
            showToast('Screen sharing stopped');
        }

        function updateParticipantCount() {
            const count = peerConnections.size + 1;
            participantCountSpan.innerHTML = `👥 ${count} participant${count !== 1 ? 's' : ''}`;
        }

        // ==================== MEETING LIFECYCLE ====================
        async function leaveMeeting() {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            for (const [_, peer] of peerConnections) {
                peer.pc.close();
            }
            peerConnections.clear();
            if (ws) {
                ws.send(JSON.stringify({ type: 'leave-room', userName }));
                ws.close();
            }
            videoGrid.innerHTML = '';
            joinScreen.style.display = 'flex';
            meetingUI.style.display = 'none';
            saveMeetingState(null, null);
            showToast('You left the meeting');
        }

        async function startMeeting(roomId, displayName, isAutoJoin = false) {
            currentRoomId = roomId;
            userId = generateUserId();
            userName = displayName;
            displayRoomCode.textContent = roomId;
            
            const mediaOk = await setupLocalMedia();
            if (!mediaOk) return;
            
            await connectWebSocket(roomId, userId, userName);
            
            joinScreen.style.display = 'none';
            meetingUI.style.display = 'flex';
            if (!isAutoJoin) {
                saveMeetingState(roomId, displayName);
                showToast(`Welcome, ${userName}!`);
            } else {
                showToast(`Rejoined meeting ${roomId}`);
            }
        }

        // ==================== EVENT LISTENERS ====================
        createBtn.onclick = () => {
            const name = usernameInput.value.trim();
            if (!name) {
                showToast('Please enter your name');
                usernameInput.focus();
                return;
            }
            startMeeting(generateRoomCode(), name);
        };
        
        joinBtn.onclick = () => {
            const name = usernameInput.value.trim();
            const code = roomCodeInput.value.trim().toUpperCase();
            if (!name) {
                showToast('Please enter your name');
                usernameInput.focus();
                return;
            }
            if (!code) {
                showToast('Please enter a meeting code');
                roomCodeInput.focus();
                return;
            }
            startMeeting(code, name);
        };
        
        copyCodeBtn.onclick = () => {
            navigator.clipboard.writeText(currentRoomId);
            showToast('Meeting code copied!');
        };
        
        fullscreenBtn.onclick = () => {
            if (!document.fullscreenElement) {
                meetingUI.requestFullscreen();
                fullscreenBtn.innerHTML = '📴 Exit';
            } else {
                document.exitFullscreen();
                fullscreenBtn.innerHTML = '🖥️ Fullscreen';
            }
        };
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.innerHTML = '📴 Exit';
            } else {
                fullscreenBtn.innerHTML = '🖥️ Fullscreen';
            }
        });
        
        micBtn.onclick = toggleMic;
        camBtn.onclick = toggleCamera;
        screenBtn.onclick = () => {
            if (isScreenSharing) stopScreenShare();
            else startScreenShare();
        };
        leaveBtn.onclick = leaveMeeting;
        
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createBtn.click();
        });
        roomCodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinBtn.click();
        });
        
        // Auto-join if previously in a meeting
        loadSavedState();
    </script>
</body>
</html>

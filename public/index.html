<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#10111b">
  <meta name="description" content="Start or join a video meeting with MeetStream Pro.">
  <title>MeetStream Pro</title>
  <link rel="icon" href="assets/meetstream-icon.webp" type="image/webp">
  <link rel="stylesheet" href="styles.css?v=5">
  <script defer src="app.js?v=5"></script>
  <script type="module" src="appearance.js?v=5"></script>
</head>
<body>
  <main id="joinScreen" class="lobby-shell">
    <header class="window-bar">
      <div class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="brand"><img class="brand-icon" src="assets/meetstream-icon.webp" alt=""><span>MeetStream <small>Pro</small></span></div>
      <div class="window-actions">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch to light theme" title="Switch to light theme" data-icon="sun"></button>
        <button type="button" class="icon-btn" data-shortcuts aria-label="Keyboard shortcuts" title="Keyboard shortcuts" data-icon="keyboard"></button>
      </div>
    </header>

    <div class="lobby-main">
      <section class="lobby-art" aria-labelledby="brand-heading">
        <img class="hero-art" src="assets/meeting-art.webp" alt="">
        <div class="hero-copy">
          <h1 id="brand-heading">Make time<br>to connect.</h1>
          <p>Video meetings with screen sharing.</p>
        </div>
      </section>

      <section class="lobby-content" aria-labelledby="lobby-heading">
        <div class="lobby-intro">
          <h2 id="lobby-heading">Join a meeting</h2>
          <p>Enter a room code or start a new meeting.</p>
        </div>
        <div class="form-stack">
          <label for="usernameInput">Display name</label>
          <input id="usernameInput" autocomplete="nickname" placeholder="e.g. Alex Morgan">
          <div class="field">
            <label for="roomCode">Room code</label>
            <input id="roomCode" autocomplete="off" autocapitalize="characters" placeholder="e.g. 8QFP2K7A">
          </div>
          <div class="lobby-buttons">
            <button class="primary" id="joinBtn" type="button"><span data-icon="logIn"></span> Join meeting</button>
            <button class="secondary" id="createBtn" type="button"><span data-icon="plus"></span> New meeting</button>
          </div>
        </div>
      </section>
    </div>

    <footer class="window-footer">
      <span><span data-icon="check"></span> No account required</span>
      <button type="button" class="text-button" data-shortcuts>Keyboard shortcuts</button>
    </footer>
  </main>

  <main id="meetingUI" class="meeting-shell">
    <header class="meeting-header">
      <div class="brand"><img class="brand-icon" src="assets/meetstream-icon.webp" alt=""><span>MeetStream <small>Pro</small></span></div>
      <div class="room-heading"><h1>Meeting <span id="displayRoomCode"></span></h1></div>
      <div class="meeting-actions">
        <button id="copyCodeBtn" type="button" class="secondary" aria-label="Copy room code" title="Copy room code"><span data-icon="copy"></span><span>Copy code</span></button>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch to light theme" title="Switch to light theme" data-icon="sun"></button>
        <button type="button" class="icon-btn" data-shortcuts aria-label="Keyboard shortcuts" title="Keyboard shortcuts" data-icon="keyboard"></button>
      </div>
    </header>

    <div class="meeting-body">
      <section class="stage" aria-label="Video stage">
        <div class="stage-bar">
          <span id="participantCount" class="stage-count">1 participant</span>
          <button id="fullscreenBtn" type="button" class="icon-btn stage-fullscreen" aria-label="Enter full screen" title="Enter full screen" data-icon="fullscreen"></button>
        </div>
        <div id="videoGrid" class="video-grid"></div>
      </section>
    </div>

    <footer class="meeting-footer">
      <div class="dock" aria-label="Meeting controls">
        <button id="micBtn" type="button" class="dock-btn" aria-label="Microphone" aria-pressed="true"><span data-icon="mic"></span><span>Mic</span></button>
        <button id="camBtn" type="button" class="dock-btn" aria-label="Camera" aria-pressed="true"><span data-icon="video"></span><span>Camera</span></button>
        <button id="screenBtn" type="button" class="dock-btn" aria-label="Share screen" aria-pressed="false"><span data-icon="screen"></span><span>Share</span></button>
      </div>
      <button id="leaveBtn" type="button" class="leave-button"><span data-icon="phone"></span><span>Leave</span></button>
    </footer>
  </main>

  <dialog id="shortcuts-dialog" class="dialog" aria-labelledby="shortcuts-title">
    <form method="dialog" class="dialog-header"><h2 id="shortcuts-title">Keyboard shortcuts</h2><button class="icon-btn" aria-label="Close" data-icon="close"></button></form>
    <dl class="shortcut-list">
      <div><dt>Toggle microphone</dt><dd><kbd>1</kbd></dd></div>
      <div><dt>Toggle camera</dt><dd><kbd>2</kbd></dd></div>
      <div><dt>Share screen with audio</dt><dd><kbd>3</kbd></dd></div>
    </dl>
  </dialog>
</body>
</html>
